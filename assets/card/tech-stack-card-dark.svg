<text x="34" y="146.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Backend</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Node.js | Express.js</tspan></text>
