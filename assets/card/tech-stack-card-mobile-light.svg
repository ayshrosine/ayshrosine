<text x="72" y="228" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Database</tspan><tspan fill="#75675C">: ...... </tspan><tspan fill="#211A16">MongoDB | PostgreSQL | MySQL</tspan></text>
<text x="72" y="249" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Focus</tspan><tspan fill="#75675C">: ......... </tspan><tspan fill="#211A16">Full Stack Development | System Design</tspan></text>
<text x="72" y="270" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Learning</tspan><tspan fill="#75675C">: ...... </tspan><tspan fill="#211A16">MERN Stack | DevOps | AI APIs</tspan></text>
<text x="72" y="291" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Interests</tspan><tspan fill="#75675C">: ..... </tspan><tspan fill="#211A16">Web Development | DevOps | Open Source | AI Integration</tspan></text>
<text x="72" y="312" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Status</tspan><tspan fill="#75675C">: ........ </tspan><tspan fill="#211A16">Building scalable web applications &amp; AI-powered projects 🚀</tspan></text>
