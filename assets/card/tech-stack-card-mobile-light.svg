<text x="72" y="417" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">BIT-Tadoba</tspan><tspan fill="#75675C">: .... </tspan><tspan fill="#211A16">🏆 1st Position — 2026</tspan></text>
<text x="72" y="438" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">TECHELONS</tspan><tspan fill="#75675C">: ..... </tspan><tspan fill="#211A16">🏆 1st Position — 2026</tspan></text>
<text x="72" y="459" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">CIH</tspan><tspan fill="#75675C">: ........... </tspan><tspan fill="#211A16">🥈 Top 15</tspan></text>
<text x="72" y="480" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">Idea3</tspan><tspan fill="#75675C">: ......... </tspan><tspan fill="#211A16">🥈 Top 10</tspan></text>
<text x="72" y="501" class="system-row" font-size="13"><tspan fill="#75675C">. </tspan><tspan class="system-key" fill="#1F6FEB">HackronyX</tspan><tspan fill="#75675C">: ..... </tspan><tspan fill="#211A16">🥈 Top 10</tspan></text>
<text x="72" y="543" class="system-footer" fill="#1F6FEB" font-size="13">TECH STACK &amp; HACKATHON WINS</text>
<text x="360" y="669" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.5" fill="#75675C">FULL-STACK DEVELOPMENT / AI INTEGRATION / HACKATHON WINNER</text>
<rect class="motion-scan" x="0" y="-70" width="720" height="70" fill="url(#scan)" opacity="0.42" style="mix-blend-mode:multiply"/>
<rect x="3" y="3" width="714" height="698" rx="16" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.76"/>
</svg>