<svg xmlns="http://www.w3.org/2000/svg" width="720" height="704" viewBox="0 0 720 704" role="img" aria-labelledby="title description">
<title id="title">Ayush Bisen - Tech Stack &amp; Achievements</title>
<desc id="description">A terminal-style card listing Ayush's tech stack and hackathon achievements.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF3EA"/><stop offset="1" stop-color="#F3E6D8"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B949E"/><stop offset="0.48" stop-color="#58A6FF"/><stop offset="1" stop-color="#8B949E"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58A6FF" stop-opacity="0"/><stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.46"/><stop offset="1" stop-color="#8B949E" stop-opacity="0"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#58A6FF" opacity="0.05"/></pattern>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .terminal-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #75675C; }
    .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #58A6FF; }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #75675C; opacity: 0.8; }
    .system-section, .system-footer, .system-row { font-family: 'Courier New', Consolas, monospace; }
    .system-section, .system-key { font-weight: 700; }
    text, tspan { white-space: pre; }
    @keyframes scan-sweep { from { transform: translateY(0); } to { transform: translateY(844px); } }
    @media (prefers-reduced-motion: no-preference) { .motion-scan { animation: scan-sweep 8s linear infinite; } }
    @media (prefers-reduced-motion: reduce) { .motion-scan { display: none; } }
  </style>
</defs>
<rect width="720" height="704" rx="18" fill="url(#background)"/>
<rect width="720" height="704" rx="18" fill="url(#scanlines)"/>
<rect x="20" y="20" width="680" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.84"/>
<circle cx="41" cy="41" r="5" fill="#1F6FEB" opacity="0.88"/>
<circle cx="59" cy="41" r="5" fill="#8B949E" opacity="0.7"/>
<circle cx="77" cy="41" r="5" fill="#8B949E" opacity="0.78"/>
