<text x="34" y="361.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">BIT-Tadoba</tspan><tspan fill="#8B949E">: .... </tspan><tspan fill="#F0F6FC">🏆 1st Position — 2026</tspan></text>
<text x="34" y="383" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">TECHELONS</tspan><tspan fill="#8B949E">: ..... </tspan><tspan fill="#F0F6FC">🏆 1st Position — 2026</tspan></text>
<text x="34" y="404.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">CIH</tspan><tspan fill="#8B949E">: ........... </tspan><tspan fill="#F0F6FC">🥈 Top 15</tspan></text>
<text x="34" y="426" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Idea3</tspan><tspan fill="#8B949E">: ......... </tspan><tspan fill="#F0F6FC">🥈 Top 10</tspan></text>
<text x="34" y="447.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">HackronyX</tspan><tspan fill="#8B949E">: ..... </tspan><tspan fill="#F0F6FC">🥈 Top 10</tspan></text>
<text x="34" y="490.5" class="system-footer" fill="#C9D1D9" font-size="14">TECH STACK &amp; HACKATHON WINS</text>
<text x="430" y="585" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.5" fill="#8B949E">FULL-STACK DEVELOPMENT / AI INTEGRATION / HACKATHON WINNER</text>
<rect class="motion-scan" x="0" y="-70" width="860" height="70" fill="url(#scan)" opacity="0.42" style="mix-blend-mode:screen"/>
<rect x="3" y="3" width="854" height="604" rx="16" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.76"/>
