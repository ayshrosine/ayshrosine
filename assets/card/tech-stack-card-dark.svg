<text x="34" y="189.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Focus</tspan><tspan fill="#8B949E">: ......... </tspan><tspan fill="#F0F6FC">Full Stack Development | System Design</tspan></text>
<text x="34" y="211" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Learning</tspan><tspan fill="#8B949E">: ...... </tspan><tspan fill="#F0F6FC">MERN Stack | DevOps | AI APIs</tspan></text>
<text x="34" y="232.5" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Interests</tspan><tspan fill="#8B949E">: ..... </tspan><tspan fill="#F0F6FC">Web Development | DevOps | Open Source | AI Integration</tspan></text>
<text x="34" y="254" class="system-row" font-size="14"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Status</tspan><tspan fill="#8B949E">: ........ </tspan><tspan fill="#F0F6FC">Building scalable web applications &amp; AI-powered projects 🚀</tspan></text>
