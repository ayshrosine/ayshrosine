  <ellipse class="motion-orbit motion-orbit--backward" style="transform-origin:268.4px 292.2px" cx="268.4" cy="292.2" rx="169.2" ry="96.5" fill="none" stroke="#C98A67" stroke-width="1" stroke-dasharray="28 24" opacity="0.1"/>
  <path d="M 52 128 H 94 M 52 128 V 170 M 466 478 H 424 M 466 478 V 436" fill="none" stroke="#D97745" stroke-width="1.2" opacity="0.2"/>
  <path d="M 52 334.2 C 84.0 300.2, 141.5 350.2, 188.0 319.2" fill="none" stroke="#E3A27D" stroke-width="1" opacity="0.12"/>
  <path d="M 466 240.2 C 428.0 274.2, 399.5 222.2, 353.0 262.2" fill="none" stroke="#91A07F" stroke-width="1" opacity="0.11"/>
  <g fill="#D97745">
    <circle cx="52" cy="128" r="2.2" opacity="0.42"/>
    <circle cx="466" cy="478" r="2.2" opacity="0.42"/>
    <circle cx="64" cy="340.2" r="1.7" opacity="0.32"/>
