<rect x="14" y="64" width="488" height="468" rx="14" fill="#211A16" fill-opacity="0.38" stroke="url(#border)" stroke-opacity="0.42"/>
<rect x="508" y="48" width="655" height="500" rx="14" fill="#211A16" fill-opacity="0.42" stroke="url(#border)" stroke-opacity="0.42"/>
